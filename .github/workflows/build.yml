name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # The whole mod (sources, data files and the icon) is embedded below,
      # so this single file is all the repository needs.
      - name: Generate mod project
        run: |
          cat > 'build.gradle' <<'END_OF_FILE'
          plugins {
              id 'java-library'
              id 'net.neoforged.moddev' version '2.0.78'
          }

          version = '1.0.0'
          group = 'net.forgotten.infdev'

          base {
              archivesName = 'forgotten_infdev'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(21)

          neoForge {
              version = '21.1.172'

              runs {
                  client {
                      client()
                  }
                  server {
                      server()
                      programArgument '--nogui'
                  }
              }

              mods {
                  "forgotten_infdev" {
                      sourceSet(sourceSets.main)
                  }
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          END_OF_FILE
          cat > 'gradle.properties' <<'END_OF_FILE'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.daemon=false
          org.gradle.parallel=true
          END_OF_FILE
          cat > 'settings.gradle' <<'END_OF_FILE'
          pluginManagement {
              repositories {
                  mavenLocal()
                  gradlePluginPortal()
                  maven { url = 'https://maven.neoforged.net/releases' }
              }
          }
          rootProject.name = 'forgotten_infdev'
          END_OF_FILE
          mkdir -p 'src/main/java/net/forgotten/infdev'
          cat > 'src/main/java/net/forgotten/infdev/ForgottenInfdev.java' <<'END_OF_FILE'
          package net.forgotten.infdev;

          import com.mojang.serialization.MapCodec;
          import net.forgotten.infdev.world.InfdevChunkGenerator;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.world.level.chunk.ChunkGenerator;
          import net.neoforged.bus.api.IEventBus;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.neoforge.registries.DeferredRegister;

          @Mod(ForgottenInfdev.MOD_ID)
          public class ForgottenInfdev {
              public static final String MOD_ID = "forgotten_infdev";

              private static final DeferredRegister<MapCodec<? extends ChunkGenerator>> GENERATORS =
                      DeferredRegister.create(Registries.CHUNK_GENERATOR, MOD_ID);

              static {
                  GENERATORS.register("infdev", () -> InfdevChunkGenerator.CODEC);
              }

              public ForgottenInfdev(IEventBus modBus) {
                  GENERATORS.register(modBus);
              }
          }
          END_OF_FILE
          mkdir -p 'src/main/java/net/forgotten/infdev'
          cat > 'src/main/java/net/forgotten/infdev/InfdevRules.java' <<'END_OF_FILE'
          package net.forgotten.infdev;

          import net.minecraft.core.component.DataComponents;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.entity.ai.attributes.AttributeInstance;
          import net.minecraft.world.entity.ai.attributes.AttributeModifier;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.food.FoodData;
          import net.minecraft.world.food.FoodProperties;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.neoforge.event.entity.living.LivingEntityUseItemEvent;
          import net.neoforged.neoforge.event.tick.PlayerTickEvent;

          /** Old-school mechanics inside the Infdev dimension: no hunger, no sprint, no regen, no attack cooldown, food heals directly. */
          @EventBusSubscriber(modid = ForgottenInfdev.MOD_ID)
          public final class InfdevRules {
              private static final ResourceLocation NO_COOLDOWN =
                      ResourceLocation.fromNamespaceAndPath(ForgottenInfdev.MOD_ID, "no_attack_cooldown");

              private InfdevRules() {}

              @SubscribeEvent
              public static void onPlayerTick(PlayerTickEvent.Post event) {
                  if (!(event.getEntity() instanceof ServerPlayer player)) return;
                  AttributeInstance speed = player.getAttribute(Attributes.ATTACK_SPEED);
                  if (speed == null) return;

                  if (player.level().dimension().equals(VoidHandler.INFDEV)) {
                      if (!speed.hasModifier(NO_COOLDOWN)) {
                          speed.addTransientModifier(new AttributeModifier(NO_COOLDOWN, 1000.0, AttributeModifier.Operation.ADD_VALUE));
                      }
                      // Food level 6: can't sprint, can't naturally regenerate, can't starve. The bar is hidden client-side.
                      FoodData food = player.getFoodData();
                      if (food.getFoodLevel() != 6) food.setFoodLevel(6);
                      food.setSaturation(0.0F);
                      food.setExhaustion(0.0F);
                      if (player.isSprinting()) player.setSprinting(false);
                  } else if (speed.hasModifier(NO_COOLDOWN)) {
                      speed.removeModifier(NO_COOLDOWN);
                  }
              }

              /** Beta-style: eating heals health directly. */
              @SubscribeEvent
              public static void onEat(LivingEntityUseItemEvent.Finish event) {
                  if (event.getEntity() instanceof ServerPlayer player && player.level().dimension().equals(VoidHandler.INFDEV)) {
                      FoodProperties food = event.getItem().get(DataComponents.FOOD);
                      if (food != null) {
                          player.heal(food.nutrition());
                      }
                  }
              }
          }
          END_OF_FILE
          mkdir -p 'src/main/java/net/forgotten/infdev'
          cat > 'src/main/java/net/forgotten/infdev/VoidHandler.java' <<'END_OF_FILE'
          package net.forgotten.infdev;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.server.level.TicketType;
          import net.minecraft.tags.DamageTypeTags;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.Marker;
          import net.minecraft.world.entity.boss.enderdragon.EnderDragon;
          import net.minecraft.world.entity.boss.wither.WitherBoss;
          import net.minecraft.world.entity.item.FallingBlockEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.entity.projectile.Projectile;
          import net.minecraft.world.level.ChunkPos;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.levelgen.Heightmap;
          import net.minecraft.world.level.material.FluidState;
          import net.minecraft.world.level.portal.DimensionTransition;
          import net.minecraft.tags.FluidTags;
          import net.minecraft.world.phys.Vec3;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.neoforge.event.entity.living.LivingIncomingDamageEvent;
          import net.neoforged.neoforge.event.server.ServerStartedEvent;
          import net.neoforged.neoforge.event.tick.EntityTickEvent;
          import net.neoforged.neoforge.event.tick.PlayerTickEvent;

          /** Catches anything falling out of the Overworld and drops it into the forgotten Infdev dimension. */
          @EventBusSubscriber(modid = ForgottenInfdev.MOD_ID)
          public final class VoidHandler {
              public static final ResourceKey<Level> INFDEV = ResourceKey.create(
                      Registries.DIMENSION, ResourceLocation.fromNamespaceAndPath(ForgottenInfdev.MOD_ID, "infdev"));

              private static final String PROTECT_TAG = "forgotten_infdev_protect";
              private static final TicketType<ChunkPos> PRELOAD = TicketType.create(
                      "forgotten_infdev_preload", (a, b) -> Long.compare(a.toLong(), b.toLong()), 100);

              private VoidHandler() {}

              @SubscribeEvent
              public static void onPlayerTick(PlayerTickEvent.Post event) {
                  if (event.getEntity() instanceof ServerPlayer player) {
                      handle(player);
                  }
              }

              @SubscribeEvent
              public static void onEntityTick(EntityTickEvent.Post event) {
                  Entity entity = event.getEntity();
                  if (!(entity instanceof Player)) {
                      handle(entity);
                  }
              }

              /** Keep the forgotten world permanently loaded around its origin. */
              @SubscribeEvent
              public static void onServerStarted(ServerStartedEvent event) {
                  ServerLevel infdev = event.getServer().getLevel(INFDEV);
                  if (infdev == null) return;
                  for (int x = -2; x <= 2; x++) {
                      for (int z = -2; z <= 2; z++) {
                          infdev.setChunkForced(x, z, true);
                      }
                  }
              }

              /** No fall damage while arriving. */
              @SubscribeEvent
              public static void onDamage(LivingIncomingDamageEvent event) {
                  LivingEntity living = event.getEntity();
                  if (living.level().isClientSide()) return;
                  if (living.getPersistentData().getInt(PROTECT_TAG) > 0 && event.getSource().is(DamageTypeTags.IS_FALL)) {
                      event.setCanceled(true);
                  }
              }

              private static void handle(Entity entity) {
                  Level level = entity.level();
                  if (level.isClientSide() || !(level instanceof ServerLevel from)) return;

                  tickProtection(entity);

                  if (level.dimension() != Level.OVERWORLD || !entity.isAlive()) return;

                  double y = entity.getY();
                  int min = level.getMinBuildHeight();

                  // Pre-load the landing area well before the void so there is never a stall.
                  if (y < min + 48 && entity.tickCount % 20 == 0) {
                      preload(from, entity);
                  }
                  // Vanilla kills at minY - 64, so we grab the entity before that.
                  if (y < min - 32 && shouldTransfer(entity)) {
                      transfer(entity, from);
                  }
              }

              private static boolean shouldTransfer(Entity e) {
                  if (e instanceof Projectile || e instanceof FallingBlockEntity || e instanceof Marker
                          || e instanceof EnderDragon || e instanceof WitherBoss) {
                      return false;
                  }
                  // Passengers travel via their own tick (players dismount first).
                  return !e.isPassenger() || e instanceof ServerPlayer;
              }

              private static void preload(ServerLevel from, Entity e) {
                  ServerLevel infdev = from.getServer().getLevel(INFDEV);
                  if (infdev == null) return;
                  ChunkPos c = new ChunkPos(e.blockPosition());
                  infdev.getChunkSource().addRegionTicket(PRELOAD, c, 3, c);
              }

              private static void transfer(Entity entity, ServerLevel from) {
                  ServerLevel infdev = from.getServer().getLevel(INFDEV);
                  if (infdev == null) return;
                  if (entity.isPassenger()) entity.stopRiding();

                  BlockPos spot = findSafeSpot(infdev, entity.getBlockX(), entity.getBlockZ());
                  boolean player = entity instanceof Player;
                  double y = player ? Math.min(spot.getY() + 24, infdev.getMaxBuildHeight() - 4) : spot.getY();
                  Vec3 pos = new Vec3(spot.getX() + 0.5, y, spot.getZ() + 0.5);

                  Entity moved = entity.changeDimension(new DimensionTransition(
                          infdev, pos, Vec3.ZERO, entity.getYRot(), entity.getXRot(), DimensionTransition.DO_NOTHING));
                  if (moved == null) return;

                  moved.fallDistance = 0;
                  moved.getPersistentData().putInt(PROTECT_TAG, 1200);
                  if (moved instanceof ServerPlayer sp) {
                      sp.addEffect(new MobEffectInstance(MobEffects.SLOW_FALLING, 400, 0, false, false, false));
                      sp.displayClientMessage(Component.literal("You fell into a forgotten world..."), true);
                  }
              }

              /** Finds a column near x,z whose surface is not lava / not empty void. */
              private static BlockPos findSafeSpot(ServerLevel level, int x, int z) {
                  BlockPos fallback = null;
                  for (int r = 0; r <= 16; r += 2) {
                      for (int dx = -r; dx <= r; dx += Math.max(2, r)) {
                          for (int dz = -r; dz <= r; dz += Math.max(2, r)) {
                              int cx = x + dx, cz = z + dz;
                              level.getChunk(cx >> 4, cz >> 4); // forces the chunk to full status
                              int top = level.getHeight(Heightmap.Types.MOTION_BLOCKING_NO_LEAVES, cx, cz);
                              BlockPos p = new BlockPos(cx, top, cz);
                              if (fallback == null) fallback = p;
                              BlockState below = level.getBlockState(p.below());
                              FluidState fluid = below.getFluidState();
                              if (!below.isAir() && !fluid.is(FluidTags.LAVA)) {
                                  return p;
                              }
                          }
                      }
                  }
                  return fallback != null ? fallback : new BlockPos(x, 80, z);
              }

              private static void tickProtection(Entity entity) {
                  CompoundTag tag = entity.getPersistentData();
                  int t = tag.getInt(PROTECT_TAG);
                  if (t <= 0) return;
                  entity.fallDistance = 0;
                  t--;
                  if (entity.onGround() && t < 1180) t = 0;
                  if (t <= 0) {
                      tag.remove(PROTECT_TAG);
                      if (entity instanceof ServerPlayer sp) sp.removeEffect(MobEffects.SLOW_FALLING);
                  } else {
                      tag.putInt(PROTECT_TAG, t);
                  }
              }
          }
          END_OF_FILE
          mkdir -p 'src/main/java/net/forgotten/infdev/client'
          cat > 'src/main/java/net/forgotten/infdev/client/ClientEvents.java' <<'END_OF_FILE'
          package net.forgotten.infdev.client;

          import net.forgotten.infdev.ForgottenInfdev;
          import net.forgotten.infdev.VoidHandler;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.screens.ReceivingLevelScreen;
          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.neoforge.client.event.RenderGuiLayerEvent;
          import net.neoforged.neoforge.client.event.ScreenEvent;
          import net.neoforged.neoforge.client.gui.VanillaGuiLayers;

          @EventBusSubscriber(modid = ForgottenInfdev.MOD_ID, value = Dist.CLIENT)
          public final class ClientEvents {
              private ClientEvents() {}

              private static boolean inInfdev() {
                  Minecraft mc = Minecraft.getInstance();
                  return mc.level != null && mc.level.dimension().equals(VoidHandler.INFDEV);
              }

              /** No "Loading terrain" screen when arriving in the forgotten world. */
              @SubscribeEvent
              public static void onScreenOpening(ScreenEvent.Opening event) {
                  if (event.getNewScreen() instanceof ReceivingLevelScreen && inInfdev()) {
                      event.setCanceled(true);
                  }
              }

              /** Infdev had no hunger bar. */
              @SubscribeEvent
              public static void onGuiLayer(RenderGuiLayerEvent.Pre event) {
                  if (event.getName().equals(VanillaGuiLayers.FOOD_LEVEL) && inInfdev()) {
                      event.setCanceled(true);
                  }
              }
          }
          END_OF_FILE
          mkdir -p 'src/main/java/net/forgotten/infdev/client'
          cat > 'src/main/java/net/forgotten/infdev/client/ClientModEvents.java' <<'END_OF_FILE'
          package net.forgotten.infdev.client;

          import net.forgotten.infdev.ForgottenInfdev;
          import net.minecraft.client.renderer.DimensionSpecialEffects;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.phys.Vec3;
          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.neoforge.client.event.RegisterDimensionSpecialEffectsEvent;

          @EventBusSubscriber(modid = ForgottenInfdev.MOD_ID, bus = EventBusSubscriber.Bus.MOD, value = Dist.CLIENT)
          public final class ClientModEvents {
              private ClientModEvents() {}

              @SubscribeEvent
              public static void registerEffects(RegisterDimensionSpecialEffectsEvent event) {
                  event.register(ResourceLocation.fromNamespaceAndPath(ForgottenInfdev.MOD_ID, "infdev"), new VoidSkyEffects());
              }

              /** No sky, no sun/moon/stars, no clouds, pure black fog. */
              public static final class VoidSkyEffects extends DimensionSpecialEffects {
                  public VoidSkyEffects() {
                      super(Float.NaN, true, SkyType.NONE, false, false);
                  }

                  @Override
                  public Vec3 getBrightnessDependentFogColor(Vec3 fogColor, float brightness) {
                      return Vec3.ZERO;
                  }

                  @Override
                  public boolean isFoggyAt(int x, int y) {
                      return false;
                  }
              }
          }
          END_OF_FILE
          mkdir -p 'src/main/java/net/forgotten/infdev/world'
          cat > 'src/main/java/net/forgotten/infdev/world/InfdevChunkGenerator.java' <<'END_OF_FILE'
          package net.forgotten.infdev.world;

          import com.mojang.serialization.MapCodec;
          import com.mojang.serialization.codecs.RecordCodecBuilder;
          import net.forgotten.infdev.ForgottenInfdev;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Holder;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.server.level.WorldGenRegion;
          import net.minecraft.util.RandomSource;
          import net.minecraft.world.level.ChunkPos;
          import net.minecraft.world.level.LevelHeightAccessor;
          import net.minecraft.world.level.NaturalSpawner;
          import net.minecraft.world.level.NoiseColumn;
          import net.minecraft.world.level.StructureManager;
          import net.minecraft.world.level.biome.Biome;
          import net.minecraft.world.level.biome.BiomeManager;
          import net.minecraft.world.level.biome.BiomeSource;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.chunk.ChunkAccess;
          import net.minecraft.world.level.chunk.ChunkGenerator;
          import net.minecraft.world.level.levelgen.GenerationStep;
          import net.minecraft.world.level.levelgen.Heightmap;
          import net.minecraft.world.level.levelgen.LegacyRandomSource;
          import net.minecraft.world.level.levelgen.RandomState;
          import net.minecraft.world.level.levelgen.RandomSupport;
          import net.minecraft.world.level.levelgen.WorldgenRandom;
          import net.minecraft.world.level.levelgen.blending.Blender;
          import net.minecraft.world.level.levelgen.synth.PerlinNoise;

          import java.util.List;
          import java.util.concurrent.CompletableFuture;

          /**
           * Infdev-style terrain: 128 blocks tall, 3D-noise hills with overhangs, sea level 64,
           * one biome, noodle caves, lava lakes at the bottom, bedrock floor.
           * The engine's void-kill sits at y = -64, i.e. below this world's bedrock.
           */
          public class InfdevChunkGenerator extends ChunkGenerator {
              public static final MapCodec<InfdevChunkGenerator> CODEC = RecordCodecBuilder.mapCodec(i -> i.group(
                      BiomeSource.CODEC.fieldOf("biome_source").forGetter(ChunkGenerator::getBiomeSource)
              ).apply(i, InfdevChunkGenerator::new));

              public static final int MIN_Y = 0;
              public static final int HEIGHT = 128;
              public static final int SEA = 63;      // water fills y <= 62
              public static final int LAVA = 10;     // cave lava fills y <= 10

              private static final BlockState STONE = Blocks.STONE.defaultBlockState();
              private static final BlockState DIRT = Blocks.DIRT.defaultBlockState();
              private static final BlockState GRASS = Blocks.GRASS_BLOCK.defaultBlockState();
              private static final BlockState SAND = Blocks.SAND.defaultBlockState();
              private static final BlockState GRAVEL = Blocks.GRAVEL.defaultBlockState();
              private static final BlockState BEDROCK = Blocks.BEDROCK.defaultBlockState();
              private static final BlockState WATER = Blocks.WATER.defaultBlockState();
              private static final BlockState LAVA_STATE = Blocks.LAVA.defaultBlockState();
              private static final BlockState AIR = Blocks.AIR.defaultBlockState();

              private record Noises(PerlinNoise height, PerlinNoise density, PerlinNoise caveA, PerlinNoise caveB,
                                    PerlinNoise sand, PerlinNoise gravel) {}

              private volatile Noises noises;

              public InfdevChunkGenerator(BiomeSource biomeSource) {
                  super(biomeSource);
              }

              @Override
              protected MapCodec<? extends ChunkGenerator> codec() {
                  return CODEC;
              }

              private Noises noises(RandomState randomState) {
                  Noises n = noises;
                  if (n != null) return n;
                  synchronized (this) {
                      if (noises == null) {
                          RandomSource r = randomState.getOrCreateRandomFactory(
                                  ResourceLocation.fromNamespaceAndPath(ForgottenInfdev.MOD_ID, "terrain")).at(0, 0, 0);
                          noises = new Noises(
                                  PerlinNoise.create(r, -7, 1.0, 1.0, 0.5, 0.5, 0.25),
                                  PerlinNoise.create(r, -5, 1.0, 1.0, 0.5, 0.25),
                                  PerlinNoise.create(r, -5, 1.0, 0.5),
                                  PerlinNoise.create(r, -5, 1.0, 0.5),
                                  PerlinNoise.create(r, -4, 1.0),
                                  PerlinNoise.create(r, -4, 1.0));
                      }
                      return noises;
                  }
              }

              /** Fills solid[y] for one column using the base terrain (no caves). */
              private static void column(Noises n, int x, int z, boolean[] solid) {
                  double h = 64.0 + n.height().getValue(x, 0, z) * 11.0;
                  for (int y = 0; y < HEIGHT; y++) {
                      if (y <= 3) { solid[y] = true; continue; }
                      if (y >= 120) { solid[y] = false; continue; }
                      double dy = h - y;
                      if (dy > 26) solid[y] = true;
                      else if (dy < -26) solid[y] = false;
                      else solid[y] = dy / 16.0 + n.density().getValue(x, y * 1.4, z) * 0.85 > 0;
                  }
              }

              private static double hash(int x, int y, int z) {
                  long h = x * 3129871L ^ z * 116129781L ^ y * 42317861L;
                  h = h * h * 42317861L + h * 11L;
                  return ((h >> 16) & 0xFFFF) / 65536.0;
              }

              private void fill(ChunkAccess chunk, Noises n) {
                  ChunkPos cp = chunk.getPos();
                  Heightmap oceanFloor = chunk.getOrCreateHeightmapUnprimed(Heightmap.Types.OCEAN_FLOOR_WG);
                  Heightmap surface = chunk.getOrCreateHeightmapUnprimed(Heightmap.Types.WORLD_SURFACE_WG);
                  BlockPos.MutableBlockPos pos = new BlockPos.MutableBlockPos();
                  boolean[] solid = new boolean[HEIGHT];
                  boolean[] cave = new boolean[HEIGHT];

                  for (int lx = 0; lx < 16; lx++) {
                      for (int lz = 0; lz < 16; lz++) {
                          int wx = cp.getMinBlockX() + lx;
                          int wz = cp.getMinBlockZ() + lz;
                          column(n, wx, wz, solid);
                          java.util.Arrays.fill(cave, false);

                          int top = -1;
                          for (int y = HEIGHT - 1; y >= 0; y--) {
                              if (solid[y]) { top = y; break; }
                          }

                          // noodle caves
                          for (int y = 5; y <= top - 3; y++) {
                              if (!solid[y]) continue;
                              double a = n.caveA().getValue(wx, y * 1.3, wz);
                              if (Math.abs(a) > 0.14) continue;
                              double b = n.caveB().getValue(wx, y * 1.3, wz);
                              if (Math.abs(b) < 0.14) {
                                  solid[y] = false;
                                  cave[y] = true;
                              }
                          }

                          double sandV = n.sand().getValue(wx, 0, wz);
                          double gravV = n.gravel().getValue(wx, 3, wz);
                          boolean underwater = top < SEA;
                          boolean beach = top <= SEA + 1 && sandV > 0.0;
                          BlockState topBlock;
                          BlockState subBlock;
                          if (underwater || beach) {
                              if (sandV > 0.0) { topBlock = SAND; subBlock = SAND; }
                              else if (gravV > 0.3) { topBlock = GRAVEL; subBlock = GRAVEL; }
                              else { topBlock = DIRT; subBlock = DIRT; }
                          } else {
                              topBlock = GRASS;
                              subBlock = DIRT;
                          }

                          for (int y = 0; y < HEIGHT; y++) {
                              BlockState state = AIR;
                              if (y == 0 || (y <= 4 && hash(wx, y, wz) < (5 - y) / 5.0)) {
                                  state = BEDROCK;
                              } else if (solid[y]) {
                                  if (y == top) state = topBlock;
                                  else if (top - y <= 3) state = subBlock;
                                  else state = STONE;
                              } else if (cave[y]) {
                                  state = y <= LAVA ? LAVA_STATE : AIR;
                              } else if (y < SEA && y > top) {
                                  state = WATER;
                              }
                              if (state != AIR) {
                                  chunk.setBlockState(pos.set(wx, y, wz), state, false);
                                  oceanFloor.update(lx, y, lz, state);
                                  surface.update(lx, y, lz, state);
                              }
                          }
                      }
                  }
              }

              @Override
              public CompletableFuture<ChunkAccess> fillFromNoise(Blender blender, RandomState randomState,
                                                                  StructureManager structureManager, ChunkAccess chunk) {
                  fill(chunk, noises(randomState));
                  return CompletableFuture.completedFuture(chunk);
              }

              @Override
              public void buildSurface(WorldGenRegion region, StructureManager structureManager, RandomState randomState, ChunkAccess chunk) {
                  // surface is built in fillFromNoise
              }

              @Override
              public void applyCarvers(WorldGenRegion region, long seed, RandomState randomState, BiomeManager biomeManager,
                                       StructureManager structureManager, ChunkAccess chunk, GenerationStep.Carving step) {
                  // caves are built in fillFromNoise
              }

              @Override
              public void spawnOriginalMobs(WorldGenRegion region) {
                  ChunkPos pos = region.getCenter();
                  Holder<Biome> biome = region.getBiome(pos.getWorldPosition().atY(region.getMaxBuildHeight() - 1));
                  WorldgenRandom random = new WorldgenRandom(new LegacyRandomSource(RandomSupport.generateUniqueSeed()));
                  random.setDecorationSeed(region.getSeed(), pos.getMinBlockX(), pos.getMinBlockZ());
                  NaturalSpawner.spawnMobsForChunkGeneration(region, biome, pos, random);
              }

              @Override
              public int getGenDepth() {
                  return HEIGHT;
              }

              @Override
              public int getSeaLevel() {
                  return SEA;
              }

              @Override
              public int getMinY() {
                  return MIN_Y;
              }

              @Override
              public int getBaseHeight(int x, int z, Heightmap.Types type, LevelHeightAccessor level, RandomState randomState) {
                  boolean[] solid = new boolean[HEIGHT];
                  column(noises(randomState), x, z, solid);
                  int top = -1;
                  for (int y = HEIGHT - 1; y >= 0; y--) {
                      if (solid[y]) { top = y; break; }
                  }
                  int h = top + 1;
                  boolean floor = type == Heightmap.Types.OCEAN_FLOOR || type == Heightmap.Types.OCEAN_FLOOR_WG;
                  return floor ? h : Math.max(h, SEA);
              }

              @Override
              public NoiseColumn getBaseColumn(int x, int z, LevelHeightAccessor level, RandomState randomState) {
                  boolean[] solid = new boolean[HEIGHT];
                  column(noises(randomState), x, z, solid);
                  int top = -1;
                  for (int y = HEIGHT - 1; y >= 0; y--) {
                      if (solid[y]) { top = y; break; }
                  }
                  BlockState[] states = new BlockState[level.getHeight()];
                  for (int i = 0; i < states.length; i++) {
                      int y = level.getMinBuildHeight() + i;
                      if (y >= 0 && y < HEIGHT && solid[y]) states[i] = STONE;
                      else if (y >= 0 && y < SEA && y > top) states[i] = WATER;
                      else states[i] = AIR;
                  }
                  return new NoiseColumn(level.getMinBuildHeight(), states);
              }

              @Override
              public void addDebugScreenInfo(List<String> info, RandomState randomState, BlockPos pos) {
                  info.add("Forgotten Infdev generator");
              }
